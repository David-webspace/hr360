  # ---------- 薪資單、保險、福利（本人） ----------
  - id: P1
    user: grace.lin
    intent: lookup.payroll
    question: 我 10 月實領多少？全勤獎金為什麼少了？
    calc: 本薪 52,000＋伙食 3,000＋專業 4,000＋全勤 1,975（10/5 病假 3h=0.375 日，2,000÷30×0.375=25）=60,975；扣勞保 1,145、健保 990、勞退自提 3,828=5,963 → 實發 55,012
    expect:
      tools: [get_payslip]
      numbers: [55012, 1975]
      claims: ["全勤獎金因 10 月請了病假而按比例扣發"]

