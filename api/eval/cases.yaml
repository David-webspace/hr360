      numbers: [3000]
      claims: ["剩餘額度不能折現", "12 月 15 日前請領"]
      forbidden_claims: ["沒用完可以折現"]
    reference_answer: 你今年旅遊補助額度 8,000 元，已請領 5,000 元，還剩 3,000 元。請在 12 月 15 日前請領，未使用的額度不能折現。
    mutations:
      - ["未使用的額度不能折現", "未使用的額度年底會折現發給你"]

  # ---------- 辦事：請假草稿 ----------
  - id: A1
    user: grace.lin
    intent: action.leave_request
    question: 幫我請 2026-11-12 一整天的特休
    calc: 11/12（四）工作日 8h；可用 13h → 5h
    expect:
      tools: [draft_leave_request]
      draft: {leave_type: annual, date: "2026-11-12", hours: 8}
      claims: ["草稿還沒送出，需要本人按確認送出"]
      forbidden_claims: ["假已經請好", "已經送出給主管"]
    reference_answer: 已建立 11/12 全天特休的草稿，共 8 小時，可用特休會從 13 小時變成 5 小時。草稿還沒送出，請在畫面上按「確認送出」，送出後才會進入主管簽核。
    mutations:
      - ["草稿還沒送出，請在畫面上按「確認送出」，送出後才會進入主管簽核", "假已經幫你送出，主管核准後就生效"]

