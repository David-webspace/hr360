[project]
name = "hr360-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "fastembed>=0.9.1",
    "pyjwt>=2.15.1",
    "anthropic>=2.7.0",
    "openai>=3.49.0",
    "pyyaml>=6.0.3",
    "mcp>=2.3.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
