services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hr360
      POSTGRES_USER: hr360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr360 -d hr360"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hr360:${POSTGRES_PASSWORD}@db:5432/hr360
    ports:
      - "127.0.0.1:${API_PORT:-8360}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 主機上接本機模型（例如 Ollama）時需要
    volumes:
      # make eval 產生的報告與模型分流表寫回主機，重建映像檔不會遺失
      - ./api/eval:/app/eval
      - ./api/config:/app/config
      - uploads:/app/uploads  # 使用者上傳的證明文件
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 60

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
